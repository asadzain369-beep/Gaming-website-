<!doctype html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>Shadow SMP Admin Login</title>

<link
rel="stylesheet"
href="css/style.css">
</head>

<body>

<main class="auth-page">

<form
id="adminLoginForm"
class="auth-card">

<div class="brand">
SHADOW SMP ADMIN
</div>

<h1>
Admin Login
</h1>

<label>
Email
</label>

<input
id="adminEmail"
type="email"
required>

<label>
Password
</label>

<input
id="adminPassword"
type="password"
required>

<button
class="btn full"
type="submit">
Admin Login
</button>

<p
id="adminLoginMessage"
class="message">
</p>

</form>

</main>

<script
type="module"
src="js/admin-login.js">
</script>

</body>
</html>
