<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Contact SHADOW SMP server staff"
  >

  <title>Problems — SHADOW SMP</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

  <header class="topbar">

    <a
      class="brand"
      href="index.html"
    >
      SHADOW SMP
    </a>

    <button
      id="menuButton"
      class="menu-button"
      type="button"
      aria-label="Open navigation"
      aria-expanded="false"
    >
      Menu
    </button>

    <nav
      id="mainNav"
      class="main-nav"
    >
      <a href="index.html">Home</a>
      <a href="rules.html">Rules</a>
      <a href="players.html">Players</a>
      <a href="events.html">Events</a>
      <a href="problems.html">Problems</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="announcements.html">News</a>
      <a href="server.html">Server</a>
      <a href="login.html">Login</a>
    </nav>

  </header>

  <main>

    <section class="section">

      <div class="section-heading">

        <p class="eyebrow">
          SUPPORT
        </p>

        <h1>
          Report a Problem
        </h1>

        <p>
          Send a problem to the SHADOW SMP
          server staff.
        </p>

      </div>

      <div class="card-grid two">

        <article class="card">

          <h2>
            Submit Your Problem
          </h2>

          <form
            id="problemForm"
            class="problem-form"
          >

            <label for="problemTitle">
              Problem Title
            </label>

            <input
              id="problemTitle"
              type="text"
              placeholder="Enter problem title"
              maxlength="120"
              required
            >

            <label for="problemType">
              Problem Type
            </label>

            <select
              id="problemType"
              required
            >
              <option value="">
                Select problem type
              </option>

              <option value="server">
                Server
              </option>

              <option value="player">
                Player
              </option>

              <option value="bug">
                Bug
              </option>

              <option value="other">
                Other
              </option>
            </select>

            <label for="problemDescription">
              Description
            </label>

            <textarea
              id="problemDescription"
              placeholder="Describe your problem..."
              required
            ></textarea>

            <button
              class="btn"
              type="submit"
            >
              Submit Problem
            </button>

          </form>

          <p
            id="problemMessage"
            class="message"
          ></p>

        </article>

        <article class="card">

          <h2>
            My Problems
          </h2>

          <p>
            View the problems you have
            submitted and their status.
          </p>

          <div id="myProblems">
            Loading...
          </div>

        </article>

      </div>

    </section>

    <div id="customSections"></div>

  </main>

  <script
    type="module"
    src="js/problems.js"
  ></script>

</body>
        </html>
