<!doctype html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>Shadow SMP - Dashboard</title>

<link
rel="stylesheet"
href="css/style.css">
</head>

<body>

<section class="section">

<div class="section-heading">

<p class="eyebrow">
PLAYER PANEL
</p>

<h1>
Welcome,
<span id="username">Player</span>
</h1>

</div>

<div class="card-grid three">

<article class="card">
<span class="label">
Minecraft ID
</span>

<strong id="minecraftId">
Loading...
</strong>
</article>

<article class="card">
<span class="label">
Name
</span>

<strong id="playerName">
Loading...
</strong>
</article>

<article class="card">
<span class="label">
Age
</span>

<strong id="age">
Loading...
</strong>
</article>

<article class="card">
<span class="label">
Coins
</span>

<strong id="coins">
0
</strong>
</article>

<article class="card">
<span class="label">
Kills
</span>

<strong id="kills">
0
</strong>
</article>

<article class="card">
<span class="label">
Wins
</span>

<strong id="wins">
0
</strong>
</article>

</div>

<button
id="logoutButton"
class="btn">
Logout
</button>

</section>

<script
type="module"
src="js/dashboard.js">
</script>

</body>
  </html>
