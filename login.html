<!doctype html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>Shadow SMP - Login</title>

<link
rel="stylesheet"
href="css/style.css">
</head>

<body>

<main class="auth-page">

<section class="auth-card">

<div class="brand">
SHADOW SMP
</div>

<h1>
Player Login
</h1>

<form id="loginForm">

<label>
Email
</label>

<input
id="email"
type="email"
required>

<label>
Password
</label>

<input
id="password"
type="password"
required>

<button
class="btn full"
type="submit">
Login
</button>

</form>

<p
id="loginMessage"
class="message">
</p>

<a href="register.html">
Create Account
</a>

<br>

<a href="admin-login.html">
Admin Login
</a>

</section>

</main>

<script
type="module"
src="js/login.js">
</script>

</body>
</html>
